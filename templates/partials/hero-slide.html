  <article class="hero__link{{ACTIVE}}">
    <a class="hero__inner" href="{{HREF}}">
      <div class="hero__media">{{COVER}}</div>
      <div class="hero__text">
        <p class="kicker kicker--hero">{{KICKER}}</p>
        <h1 class="hero__title">{{TITLE}}</h1>
        <p class="hero__excerpt">{{EXCERPT}}</p>
        <p class="hero__meta">
          <span>{{DATE}}</span><span>{{MINUTES}} 分钟读完</span>
          <span class="hero__score">{{SCORE}}<i>/10</i></span>
        </p>
        <span class="cta">阅读全文 <i>→</i></span>
      </div>
    </a>
  </article>
