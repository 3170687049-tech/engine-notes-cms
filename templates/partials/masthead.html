<header class="mast">
  <div class="mast__bar">
    <div class="wrap mast__bar-in">
      <span class="mast__issue">{{ISSUE}}</span>
      <span class="mast__date">{{DATE_TODAY}}</span>
    </div>
  </div>
  <div class="wrap mast__head">
    <a class="mast__logo" href="{{P}}index.html">
      <span class="mast__title">{{SITE_TITLE}}</span>
      <span class="mast__sub">{{SUBTITLE}}</span>
    </a>
    <p class="mast__tagline">{{TAGLINE}}</p>
    {{NAV}}
  </div>
</header>
