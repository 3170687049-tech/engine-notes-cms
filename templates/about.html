<section class="page-head">
  <div class="wrap about__head">
    {{AVATAR_BLOCK}}
    <div>
      <p class="kicker">About</p>
      <h1 class="page-title">{{AUTHOR}}</h1>
      <p class="page-sub">{{SITE}} · {{SUBTITLE}}</p>
      <p class="author__bio">{{BIO}}</p>
      <div class="about__links">{{LINKS}}</div>
    </div>
  </div>
</section>

<section class="wrap about">
  <div class="about__stats">
    <div class="stat"><b>{{TOTAL}}</b><em>篇评测</em></div>
    <div class="stat"><b>{{BRANDS}}</b><em>个品牌</em></div>
    <div class="stat"><b>{{SINCE}}</b><em>年起笔</em></div>
  </div>

  <div class="about__two">
    <section class="panel">
      <h3 class="panel__t">最近更新 <span>Latest</span></h3>
      <ul class="latest">{{LATEST_LIST}}</ul>
    </section>
    <section class="panel panel--mail">
      <h3 class="panel__t">找我约稿 <span>Contact</span></h3>
      <p>评测邀约、试驾车申请或纯粹想聊聊某台车，都可以从这里找到我。</p>
      <div class="about__links about__links--big">{{LINKS2}}</div>
    </section>
  </div>
</section>
